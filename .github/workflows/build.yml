
name: Zbuduj RLTracker EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalacja zaleznosci
        run: npm install

      - name: Budowanie EXE
        run: npx electron-builder --win portable --publish never

      - name: Udostepnij EXE
        uses: actions/upload-artifact@v4
        with:
          name: RLTracker-Windows
          path: dist/*.exe
